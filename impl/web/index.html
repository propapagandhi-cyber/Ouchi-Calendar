<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FFF8F0" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#17191E" media="(prefers-color-scheme: dark)">
  <meta name="description" content="家族の予定とやることを、大きな字で見やすく共有するカレンダー">
  <meta name="robots" content="noindex">
  <title>おうちカレンダー</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="app">
    <div class="top-sticky">
      <header id="topbar" class="topbar"></header>
      <nav id="filterbar" class="filterbar" aria-label="だれの予定を表示するか"></nav>
      <div id="banner" class="banner" role="status" hidden></div>
    </div>
    <main id="main" class="main"></main>
    <button id="fab" class="fab" type="button"></button>
    <nav id="tabbar" class="tabbar" aria-label="表示の切り替え"></nav>
  </div>
  <noscript>このアプリを使うには JavaScript を有効にしてください。</noscript>
  <script type="module" src="js/main.js"></script>
</body>
</html>
